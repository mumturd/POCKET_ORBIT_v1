<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A little space escape. Collect stars and dodge rocks in a compact arcade game."><title>Pocket Orbit</title><style>
*{box-sizing:border-box}body{margin:0;background:#101523;color:#f7f2e9;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center;padding:18px}main{width:min(100%,760px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:21px;font-weight:800;letter-spacing:-.8px}.brand span{color:#b6f486;margin-right:7px}.tag{font-size:10px;letter-spacing:2px;color:#a5aec4}button{font:inherit;cursor:pointer;color:inherit;background:#252e42;border:1px solid #424d65;border-radius:12px;padding:9px 13px}button:hover{background:#35405a}button:focus-visible{outline:3px solid #b6f486;outline-offset:3px}.board{position:relative;overflow:hidden;border-radius:22px;border:1px solid #394258;background:#151d30;height:min(65svh,450px);min-height:260px}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;pointer-events:none}.label{font-size:9px;letter-spacing:2px;color:#b1bdd4}.value{font-size:25px;font-variant-numeric:tabular-nums;font-weight:750}.right{text-align:right}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#10172966;backdrop-filter:blur(3px);padding:20px}.overlay.hidden{display:none}.card{max-width:390px}.eyebrow{font-size:10px;letter-spacing:3px;color:#b6f486}h1{font-size:clamp(34px,6vw,57px);line-height:1.03;letter-spacing:-2px;margin:14px 0}p{color:#b8c4dc;font-size:14px;line-height:1.6;margin:14px 0 22px}.play{background:#b6f486;color:#17251c;font-weight:800;border:0;padding:13px 26px;box-shadow:0 5px 28px #b6f41b15}.play:hover{background:#caff9e}.small{font-size:11px;color:#96a4c1;margin-top:13px}footer{display:flex;justify-content:space-between;gap:12px;margin-top:13px;color:#96a4c1;font-size:11px;align-items:center}kbd{font:inherit;color:#e7edf9;background:#283147;border-radius:4px;padding:3px 6px}.legend{display:flex;gap:12px}.gold{color:#ffdc82}.coral{color:#f69591}@media(max-width:470px){.tag,.legend{display:none}body{padding:12px}.hud{left:16px;right:16px}}
</style></head><body><main><header><div class="brand"><span>✳</span> pocket orbit</div><div class="tag">A LITTLE SPACE ESCAPE</div><button id="pause" aria-label="Pause game">Ⅱ Pause</button></header><section class="board" aria-label="Pocket Orbit arcade game"><canvas id="game" aria-label="Move left and right to catch golden stars and avoid pink asteroids"></canvas><div class="hud"><div><div class="label">STARDUST</div><div class="value" id="score">000</div></div><div class="right"><div class="label">PERSONAL BEST</div><div class="value" id="best">000</div></div></div><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">SMALL SCREEN. BIG UNIVERSE.</div><h1 id="title">Just one<br>more orbit.</h1><p id="message">Catch the golden stars. Dodge the rocks.<br>Your tiny ship has three chances.</p><button class="play" id="play">Let's fly ↗</button><div class="small" id="hint">Press Space to start</div></div></div></section><footer><div><kbd>←</kbd> <kbd>→</kbd> or move your trackpad · <kbd>P</kbd> pause</div><div class="legend"><span class="gold">✦ +10</span><span class="coral" id="lives">♥ ♥ ♥</span></div><button id="restart" aria-label="Restart game">↻ Restart</button></footer></main><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),board=document.querySelector('.board');
const ui=Object.fromEntries(['score','best','overlay','title','message','play','hint','eyebrow','pause','lives'].map(id=>[id,document.getElementById(id)]));
let w=760,h=450,state='ready',score=0,best=0,lives=3,elapsed=0,spawn=0,invincible=0,playerX=380,targetX=null,items=[],particles=[],keys=new Set(),last=0;
try{best=Number(localStorage.getItem('pocket-orbit-best'))||0}catch{}ui.best.textContent=String(best).padStart(3,'0');
const stars=Array.from({length:75},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,s:Math.random()*12+4}));
function resize(){const r=board.getBoundingClientRect();const old=w;w=r.width;h=r.height;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);playerX=playerX/old*w;targetX=null}new ResizeObserver(resize).observe(board);
function hud(){ui.score.textContent=String(score).padStart(3,'0');ui.lives.textContent='♥ '.repeat(lives);}
function start(){state='playing';score=0;lives=3;elapsed=0;spawn=.6;invincible=0;items=[];particles=[];playerX=w/2;targetX=null;keys.clear();ui.overlay.classList.add('hidden');ui.pause.textContent='Ⅱ Pause';hud();}
function pause(){if(state==='playing'){state='paused';keys.clear();ui.title.textContent='Take a breather.';ui.eyebrow.textContent='HOLDING POSITION';ui.message.textContent='Your little universe can wait.';ui.play.textContent='Keep flying ↗';ui.hint.textContent='Press Space or P to resume';ui.overlay.classList.remove('hidden');ui.pause.textContent='▷ Resume'}else if(state==='paused'){state='playing';ui.overlay.classList.add('hidden');ui.pause.textContent='Ⅱ Pause'}}
function end(){state='over';if(score>best){best=score;try{localStorage.setItem('pocket-orbit-best',best)}catch{}}ui.best.textContent=String(best).padStart(3,'0');ui.title.textContent='A lovely little run.';ui.eyebrow.textContent='BACK TO EARTH';ui.message.textContent=score+' stardust · '+Math.floor(elapsed)+' seconds in space. Ready for another?';ui.play.textContent='Fly again ↗';ui.hint.textContent='Press Space to play again';ui.overlay.classList.remove('hidden');}
function burst(x,y,color){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,color})}}
function update(dt){elapsed+=dt;invincible=Math.max(0,invincible-dt);if(keys.has('arrowleft')||keys.has('a')){playerX-=dt*420;targetX=null}if(keys.has('arrowright')||keys.has('d')){playerX+=dt*420;targetX=null}if(targetX!==null)playerX+=(targetX-playerX)*Math.min(1,dt*16);playerX=Math.max(20,Math.min(w-20,playerX));spawn-=dt;if(spawn<=0){const rock=Math.random()<.57;items.push({x:24+Math.random()*(w-48),y:-25,r:rock?13+Math.random()*9:10,rock,speed:95+Math.min(180,elapsed*3)+Math.random()*45,rot:Math.random()*6});spawn=Math.max(.2,.65-elapsed*.006)}for(const o of items){o.y+=o.speed*dt;o.rot+=dt;if(Math.hypot(o.x-playerX,o.y-(h-45))<o.r+12){if(!o.rock){score+=10;burst(o.x,o.y,'#ffdc82');o.dead=true;hud()}else if(invincible===0){lives--;invincible=1.4;burst(o.x,o.y,'#f69591');o.dead=true;hud();if(lives===0){end();break}}}}items=items.filter(o=>!o.dead&&o.y<h+30);}
function draw(dt){ctx.clearRect(0,0,w,h);const grad=ctx.createRadialGradient(w*.65,h*.35,0,w*.65,h*.35,w*.75);grad.addColorStop(0,'#26304e');grad.addColorStop(1,'#111a2c');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(const s of stars){if(state==='playing')s.y=(s.y+dt*s.s/h)%1;ctx.globalAlpha=.25+s.r/2;ctx.fillStyle='#d0defe';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#7488b21c';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(w*.8,h*.4,160,55,-.5,0,Math.PI*2);ctx.stroke();for(const o of items){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.fillStyle=o.rock?'#cf858d':'#ffdc82';ctx.strokeStyle=o.rock?'#f4afb0':'#fff1bb';ctx.lineWidth=2;ctx.beginPath();const n=o.rock?7:8;for(let j=0;j<n;j++){const a=j/n*Math.PI*2,r=o.rock?o.r*(j%2?.85:1):o.r*(j%2?.38:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();if(o.rock){ctx.fillStyle='#9f606f';ctx.beginPath();ctx.arc(-3,-2,o.r*.25,0,7);ctx.fill()}ctx.restore()}
if(state!=='paused'){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.save();ctx.translate(playerX,h-45);if(invincible>0)ctx.globalAlpha=.4+.6*Math.abs(Math.sin(invincible*15));ctx.fillStyle='#b6f486';ctx.shadowBlur=20;ctx.shadowColor='#b6f48666';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(16,13);ctx.lineTo(0,7);ctx.lineTo(-16,13);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#34524b';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();if(state==='playing'){ctx.fillStyle='#ffd99e';ctx.beginPath();ctx.moveTo(-4,13);ctx.lineTo(0,23+Math.sin(elapsed*30)*5);ctx.lineTo(4,13);ctx.fill()}ctx.restore();ctx.fillStyle='#a2aec5';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('♥ '.repeat(lives),20,h-18);}
function frame(t){const dt=Math.min((t-last)/1000||0,.035);last=t;if(state==='playing')update(dt);draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
ui.play.onclick=()=>state==='paused'?pause():start();ui.pause.onclick=pause;document.querySelector('#restart').onclick=start;
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d','p','escape'].includes(k)){if(e.target.tagName==='BUTTON'&&k===' ')return;e.preventDefault();if(e.repeat)return;if(k===' '){state==='playing'?pause():state==='paused'?pause():start()}else if(k==='p'||k==='escape')pause();else keys.add(k)}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});canvas.addEventListener('pointermove',e=>{if(state==='playing')targetX=e.clientX-canvas.getBoundingClientRect().left});canvas.addEventListener('pointerdown',e=>{targetX=e.clientX-canvas.getBoundingClientRect().left;canvas.setPointerCapture(e.pointerId)});
</script></body></html>
